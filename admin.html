<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>پنل مدیریت Zolaris</title>
<meta name="theme-color" content="#3D0D0B">
<link rel="icon" href="assets/logo-z-maroon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&family=Bodoni+Moda:opsz,wght@6..96,600&display=swap" rel="stylesheet">
<!-- جلوگیری از نمایش پنل داخل سایت دیگه (clickjacking)؛ GitHub Pages هدر امنیتی نمی‌فرسته -->
<style id="noframe">body{display:none!important}</style>
<script>if (window.top === window.self) document.getElementById('noframe').remove(); else window.top.location = window.self.location.href;</script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/bg/removebg.js"></script>
<style>
:root{
  --m:#3D0D0B; --m2:#5A1A16; --tint:#EADCD7; --soft:#FAF6F5; --ink:#1E1413; --mut:#8C7C79; --line:#EFE7E5; --bg:#F7F3F2; --card:#fff;
  --ok:#2E7D4F; --warn:#B5762E; --bad:#B3261E; --info:#2F5D8A;
  --fa:'Vazirmatn',system-ui,sans-serif; --serif:'Bodoni Moda',Didot,Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fa);color:var(--ink);background:var(--bg);line-height:1.7;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.num{font-feature-settings:"tnum"}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;background:var(--m);color:#fff;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .2s,opacity .2s}
.btn:hover{background:var(--m2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--m);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #F0D3D1}
.btn.danger:hover{background:#FDF3F2}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut);font-weight:500}
.in,select.in,textarea.in{width:100%;height:42px;border:1px solid #E4D9D6;border-radius:10px;padding:0 12px;background:#fff;color:var(--ink);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.7}
.in:focus{border-color:var(--m);box-shadow:0 0 0 3px rgba(61,13,11,.08)}
.ltr{direction:ltr;text-align:left}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--m)}
.row{display:grid;gap:12px}
@media(min-width:640px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--m)}
.lbox{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:30px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lbox img{height:56px;margin:0 auto 6px}
.lbox h1{text-align:center;font-size:17px;font-weight:700;margin-bottom:2px}
.lbox p.sub{text-align:center;color:var(--mut);font-size:12.5px;margin-bottom:20px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:13px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--m);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lbox form{display:flex;flex-direction:column;gap:12px}
.lbox .btn{height:44px;width:100%}
.err{color:var(--bad);font-size:12.5px;min-height:20px}
.link{color:var(--m);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* layout */
#app{display:flex;min-height:100vh}
aside{width:230px;flex:none;background:var(--m);color:#E8D6D2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{display:flex;align-items:center;gap:10px;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.side-brand img{height:34px}
.side-brand b{font-family:var(--serif);font-size:18px;color:#fff;direction:ltr;letter-spacing:.02em}
.side-brand small{display:block;font-size:11px;color:#C4A8A2;font-family:var(--fa)}
nav.menu{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
nav.menu button{display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:10px;text-align:right;font-size:13.5px;color:#E3CFCB;transition:background .2s}
nav.menu button:hover{background:rgba(255,255,255,.07)}
nav.menu button.on{background:#fff;color:var(--m);font-weight:500}
nav.menu svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
nav.menu .badge{margin-right:auto;background:#C9483F;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#C4A8A2}
.side-foot button{color:#fff;font-size:12.5px;margin-top:4px;text-decoration:underline;text-underline-offset:3px}
main{flex:1;min-width:0;padding:26px 30px 60px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{font-size:20px;font-weight:700}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* mobile: menu becomes a top tab bar */
@media(max-width:860px){
  #app{flex-direction:column}
  aside{width:auto;height:auto;position:sticky;top:0;z-index:20}
  .side-brand{padding:10px 16px;border:0}
  .side-brand img{height:28px}
  nav.menu{flex-direction:row;overflow-x:auto;padding:0 10px 10px;gap:4px;scrollbar-width:none}
  nav.menu::-webkit-scrollbar{display:none}
  nav.menu button{flex:none;height:36px;padding:0 12px;font-size:13px}
  nav.menu svg{display:none}
  .side-foot{position:absolute;top:10px;left:16px;padding:0;border:0}
  .side-foot span{display:none}
  main{padding:18px 16px 50px}
}

/* cards & tables */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.card.pad{padding:18px}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{padding:16px}
.kpi small{color:var(--mut);font-size:12px;display:block}
.kpi b{font-size:22px;font-weight:700;display:block;margin-top:2px}
.kpi.main{background:var(--m);color:#fff;border-color:var(--m)}
.kpi.main small{color:#D9BFBA}
.g2{display:grid;gap:16px}
@media(min-width:1000px){.g2{grid-template-columns:1.4fr 1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--mut);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
.muted{color:var(--mut)}
.small{font-size:12px}

/* status pills */
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;font-weight:500;white-space:nowrap;background:#F1ECEB;color:#5b4a47}
.pill.new{background:#FFF1DE;color:#94570F}
.pill.wait{background:#F1ECEB;color:#7A6A67}
.pill.paid{background:#E5F3EA;color:var(--ok)}
.pill.ok{background:#E4EEF8;color:var(--info)}
.pill.ship{background:#EFE7F7;color:#5D3F86}
.pill.done{background:#DFF0E5;color:#1F5E39}
.pill.cancel{background:#FBE9E8;color:var(--bad)}

/* filters */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .in{max-width:280px;height:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:#5b4a47}
.chips button.on{background:var(--m);border-color:var(--m);color:#fff}
.chips button i{font-style:normal;opacity:.7;margin-right:4px}

/* order cards on mobile */
.olist{display:flex;flex-direction:column;gap:10px}
.oc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;cursor:pointer;transition:border-color .2s}
.oc:hover{border-color:#D9C6C2}
.oc .t{font-weight:700}
.oc .r{text-align:left}
.oc .s{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
.mob{display:none}
@media(max-width:700px){#oTbl{display:none}.olist.mob{display:flex}}

/* products */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1150px){.pgrid{grid-template-columns:repeat(5,1fr)}}
.pc{overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .2s}
.pc:hover{border-color:#D9C6C2}
.pc .im{aspect-ratio:3/4;background:var(--soft);position:relative}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .im .tag{position:absolute;top:8px;right:8px}
.pc .bd{padding:10px 12px 12px}
.pc b{font-size:13px;font-weight:500;display:block;line-height:1.5}
.pc .pr{font-size:12.5px;margin-top:4px}
.pc .pr s{color:var(--mut);margin-left:6px}
.pc .st{font-size:11.5px;color:var(--mut)}
.pc .st.low{color:var(--bad)}

/* dialogs */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);margin:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);color:var(--ink)}
dialog::backdrop{background:rgba(30,10,8,.45)}
dialog.wide{width:min(820px,calc(100vw - 24px))}
dialog.narrow{width:min(400px,calc(100vw - 24px))}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dh h3{font-size:15.5px;font-weight:700}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--mut)}
.x:hover{background:var(--soft)}
.db{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.df{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.df .sp{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--mut)}
.kv dd{word-break:break-word}
.box{background:var(--soft);border-radius:12px;padding:12px 14px}
.items{display:flex;flex-direction:column;gap:6px;font-size:13px}
.items div{display:flex;justify-content:space-between;gap:10px}
.sum{display:flex;justify-content:space-between;font-weight:700;border-top:1px dashed #DCCDC9;padding-top:8px;margin-top:4px}
.vrow{display:grid;grid-template-columns:1.4fr 1fr 1.2fr 34px;gap:8px;align-items:center}
.vrow .x{width:34px;height:34px}
.imgpick{display:flex;gap:14px;align-items:center}
.imgpick .pv{width:108px;aspect-ratio:3/4;border-radius:10px;background:var(--soft) center/contain no-repeat;border:1px solid var(--line);flex:none;position:relative;overflow:hidden}
.imgpick .pv.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);background-size:250% 100%;animation:zl-scan 1.3s linear infinite}
@keyframes zl-scan{from{background-position:120% 0}to{background-position:-120% 0}}
.imgpick .side{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.bgst{font-size:12px;color:var(--mut);min-height:18px}
.bgst.bad{color:var(--bad)}
.seg2{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px}
.seg2 button{height:28px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--mut)}
.seg2 button.on{background:#fff;color:var(--m);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.line{display:grid;grid-template-columns:1fr auto auto 34px;gap:8px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}

/* bars */
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:12.5px;margin:7px 0}
.bar .tr{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--m);border-radius:4px}

/* toast */
#toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:100;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad)}
.loading{padding:50px;text-align:center;color:var(--mut)}
.radio-cards{display:grid;gap:10px}
.radio-cards label{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.radio-cards label:has(input:checked){border-color:var(--m);background:var(--soft)}
.radio-cards input{margin-top:5px;accent-color:var(--m)}
.radio-cards b{display:block;font-size:13.5px}
.radio-cards small{color:var(--mut);font-size:12px}
.stars{color:#C8962E;letter-spacing:1px}
.rv{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rv .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px}
.rv p{font-size:13.5px;white-space:pre-wrap}
.rv .acts{display:flex;gap:6px}
</style>
</head>
<body>

<!-- ───────── ورود ───────── -->
<section id="login" hidden>
  <div class="lbox">
    <img src="assets/logo-z-maroon.png" alt="">
    <h1>پنل مدیریت Zolaris</h1>
    <p class="sub">فقط شماره‌هایی که مدیر فروشگاه هستند می‌تونن وارد بشن</p>
    <div class="seg" id="lmode">
      <button type="button" data-m="pass" class="on">با رمز عبور</button>
      <button type="button" data-m="otp">با کد پیامکی</button>
    </div>
    <form id="lform" autocomplete="on">
      <label class="f">شماره موبایل
        <input class="in ltr" id="lphone" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" autocomplete="username" required>
      </label>
      <label class="f" id="lpassWrap">رمز عبور
        <input class="in ltr" id="lpass" type="password" autocomplete="current-password">
      </label>
      <label class="f" id="lcodeWrap" hidden>کد پیامک‌شده
        <input class="in ltr" id="lcode" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      </label>
      <div class="err" id="lerr"></div>
      <button class="btn" id="lbtn">ورود</button>
      <button type="button" class="link" id="lback" hidden>تغییر شماره</button>
    </form>
  </div>
</section>

<!-- ───────── پنل ───────── -->
<div id="app" hidden>
  <aside>
    <div class="side-brand">
      <img src="assets/logo-z-white.png" alt="">
      <div><b>Zolaris</b><small>پنل مدیریت</small></div>
    </div>
    <nav class="menu" id="menu">
      <button data-v="dash" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>داشبورد</button>
      <button data-v="orders"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>سفارش‌ها<span class="badge" id="newBadge" hidden></span></button>
      <button data-v="products"><svg viewBox="0 0 24 24"><path d="M20.4 7.2 12 3 3.6 7.2v9.6L12 21l8.4-4.2Z"/><path d="M3.6 7.2 12 11.4l8.4-4.2M12 11.4V21"/></svg>محصولات</button>
      <button data-v="coupons"><svg viewBox="0 0 24 24"><path d="M3 9V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3a3 3 0 0 0 0 6v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a3 3 0 0 0 0-6Z"/><path d="M9 9h.01M15 15h.01M15 9l-6 6"/></svg>کد تخفیف</button>
      <button data-v="customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 9M22 21a7 7 0 0 0-4-6.3"/></svg>مشتری‌ها</button>
      <button data-v="reviews"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>نظرها<span class="badge" id="revBadge" hidden></span></button>
      <button data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>تنظیمات</button>
    </nav>
    <div class="side-foot"><span id="whoami"></span><br><button id="logout">خروج</button></div>
  </aside>
  <main id="view"></main>
</div>

<!-- ───────── پنجره‌ها ───────── -->
<dialog id="dlg"></dialog>
<dialog id="dlg2" class="narrow"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ───────── اتصال به Supabase (کلید publishable عمومیه و جای امنی برای نگه‌داری لازم نداره؛ امنیت با RLS سمت سروره) ─────────
const SB_URL = 'https://avwgfmdnwibtxurlnphw.supabase.co';
const SB_KEY = 'sb_publishable_VOh9R0tdxf-3YFN9_y3J1Q_mf9kIXf2';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, storageKey: 'zl-admin' } });

// ───────── ابزارها ─────────
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fa = n => Number(n || 0).toLocaleString('fa-IR');
const toman = n => fa(n) + ' تومان';
const TZ = { timeZone: 'Asia/Tehran' };
const fdate = d => d ? new Date(d).toLocaleDateString('fa-IR', TZ) : '—';
const ftime = d => d ? new Date(d).toLocaleString('fa-IR', { ...TZ, year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const ago = d => {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return 'همین الان';
  if (s < 3600) return fa(Math.floor(s / 60)) + ' دقیقه پیش';
  if (s < 86400) return fa(Math.floor(s / 3600)) + ' ساعت پیش';
  if (s < 86400 * 7) return fa(Math.floor(s / 86400)) + ' روز پیش';
  return fdate(d);
};
const toEn = s => String(s ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const intOf = s => { const v = toEn(s).replace(/[^0-9]/g, ''); return v === '' ? null : parseInt(v, 10); };
// 09xxxxxxxxx ← هر شکلی از شماره‌ی ایرانی
function normPhone(p) {
  const d = toEn(p).replace(/\D/g, '');
  if (/^09\d{9}$/.test(d)) return d;
  if (/^9\d{9}$/.test(d)) return '0' + d;
  if (/^989\d{9}$/.test(d)) return '0' + d.slice(2);
  if (/^00989\d{9}$/.test(d)) return '0' + d.slice(4);
  return null;
}
const intl = p => '+98' + p.slice(1);                    // 0912… → +98912…
const showPhone = p => p ? (String(p).startsWith('98') ? '0' + String(p).slice(2) : p) : '—';

function toast(t, bad) {
  const el = $('#toast'); el.textContent = t; el.classList.toggle('bad', !!bad); el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), bad ? 4200 : 2400);
}
const ERR = {
  HG_ADMIN: 'این کار فقط برای مدیرهاست', HG_ITEMS: 'اقلام سفارش درست نیست', HG_REQUIRED: 'نام و آدرس مشتری لازمه',
  HG_BAD_PHONE: 'شماره موبایل درست نیست', HG_STOCK: 'موجودی کافی نیست', HG_GONE: 'این محصول دیگه وجود نداره',
  HG_COUPON: 'کد تخفیف معتبر نیست', HG_LOGIN: 'دوباره وارد شو', HG_TOO_MANY: 'تعداد سفارش‌ها زیاده، کمی صبر کن', HG_BLOCKED: 'این مشتری مسدود شده',
};
function errText(e) {
  const m = String(e?.message || e || '');
  for (const k in ERR) if (m.includes(k)) { const extra = m.split(k + ':')[1]; return ERR[k] + (extra ? ' — ' + extra.trim() : ''); }
  if (/JWT|session|refresh/i.test(m)) return 'نشست تموم شده؛ دوباره وارد شو';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'اتصال به سرور برقرار نشد؛ اینترنت یا فیلترشکن رو چک کن';
  return m || 'خطای نامشخص';
}
const fail = e => { console.error(e); toast(errText(e), true); };
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }

function openDlg(html, cls = '') {
  const d = $('#dlg'); d.className = cls; d.innerHTML = html;

}

function ask(msg, okText = 'بله', danger = true) {
  return new Promise(res => {

    d.innerHTML = `<div class="db"><p style="font-size:14px">${msg}</p></div>
      <div class="df"><button class="btn ${danger ? 'danger' : ''}" data-ok>${esc(okText)}</button><button class="btn ghost" data-no>انصراف</button></div>`;
    d.showModal();

const MANUAL = { card: 'کارت‌به‌کارت (پرداخت شده)', cod: 'پرداخت در محل', unpaid: 'هنوز پرداخت نشده' };
const CANCEL = { admin: 'لغو توسط مدیر', expired: 'پرداخت نشد و منقضی شد', replaced: 'مشتری سفارش جدید ثبت کرد' };
function payLabel(o) {

let me = null, mode = 'pass', otpSent = false;
$('#lmode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.m; otpSent = false;
  $$('#lmode button').forEach(x => x.classList.toggle('on', x === b));
  syncLogin();
};
function syncLogin() {
  $('#lpassWrap').hidden = mode !== 'pass';
  $('#lcodeWrap').hidden = !(mode === 'otp' && otpSent);
  $('#lphone').readOnly = mode === 'otp' && otpSent;
  $('#lback').hidden = !(mode === 'otp' && otpSent);
  $('#lbtn').textContent = mode === 'pass' ? 'ورود' : otpSent ? 'تایید کد و ورود' : 'ارسال کد';
  $('#lerr').textContent = '';
}
$('#lback').onclick = () => { otpSent = false; syncLogin(); };
$('#lform').onsubmit = async e => {
  e.preventDefault();
  const err = $('#lerr'), btn = $('#lbtn');
  const p = normPhone($('#lphone').value);
  if (!p) { err.textContent = 'شماره موبایل رو درست وارد کن (مثل ۰۹۱۲۳۴۵۶۷۸۹)'; return; }
  btn.disabled = true; err.textContent = '';
  try {
    if (mode === 'pass') {
      const pw = $('#lpass').value;
      if (!pw) throw new Error('رمز عبور رو وارد کن');
      const { error } = await sb.auth.signInWithPassword({ phone: intl(p), password: pw });
      if (error) throw error;
    } else if (!otpSent) {
      const { error } = await sb.auth.signInWithOtp({ phone: intl(p), options: { shouldCreateUser: false } });
      if (error) throw error;
      otpSent = true; syncLogin(); $('#lcode').focus();
      return;
    } else {
      const code = toEn($('#lcode').value).replace(/\D/g, '');
      const { error } = await sb.auth.verifyOtp({ phone: intl(p), token: code, type: 'sms' });
      if (error) throw error;
    }
  } catch (ex) {
    const m = String(ex.message || ex);
    err.textContent = /Invalid login credentials/i.test(m) ? 'شماره یا رمز اشتباهه'
      : /Token has expired|invalid/i.test(m) && mode === 'otp' ? 'کد اشتباهه یا منقضی شده'
      : /Signups not allowed|not found/i.test(m) ? 'این شماره حساب کاربری نداره'
      : /Phone logins are disabled|provider is disabled/i.test(m) ? 'ورود با موبایل هنوز در Supabase فعال نشده'
      : /sms|hook|send/i.test(m) ? 'ارسال پیامک انجام نشد؛ فعلاً با رمز عبور وارد شو'
      : errText(ex);
  } finally { btn.disabled = false; }
};
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').hidden = false; $('#app').hidden = true; syncLogin(); return; }
  const phone = session.user.phone;
  let isAdmin = false;
  try { isAdmin = !!(await q(sb.from('admins').select('phone').eq('phone', phone).maybeSingle())); } catch (e) { fail(e); }
  if (!isAdmin) {
    await sb.auth.signOut();
    $('#login').hidden = false; $('#app').hidden = true; syncLogin();
    $('#lerr').textContent = 'این شماره دسترسی مدیریت نداره';
    return;
  }
  me = { phone, id: session.user.id };
  $('#whoami').textContent = showPhone(phone);
  $('#login').hidden = true; $('#app').hidden = false;
  sb.rpc('admin_heartbeat').then(() => {});
  setInterval(() => sb.rpc('admin_heartbeat').then(() => {}), 60000);
  go(location.hash.slice(1) || 'dash');
  refreshBadges(); setInterval(refreshBadges, 60000);
}
let booted = false;
sb.auth.onAuthStateChange((ev) => {
  if (ev === 'SIGNED_IN' && !me && booted) boot();
  if (ev === 'SIGNED_OUT' && me) location.reload();
});
boot().finally(() => booted = true);

}

    <div class="db">
      <p class="small muted">برای سفارش‌هایی که از دایرکت اینستاگرام، تلفن یا حضوری می‌گیری. موجودی محصولات خودکار کم می‌شه.</p>
      <div class="row" style="grid-template-columns:1fr auto auto auto;align-items:end">
        <label class="f">محصول<select class="in" id="moP">${prods.map(p => `<option value="${p.id}">${esc(p.name)} — ${p.stock ? fa(p.stock) + ' موجود' : 'ناموجود'}</option>`).join('')}</select></label>
        <label class="f" id="moVW">مدل/سایز<select class="in" id="moV"></select></label>
        <label class="f">تعداد<input class="in num" id="moQ" type="number" min="1" value="1" style="width:80px"></label>
        <button class="btn ghost" id="moAdd" type="button">افزودن</button>
      </div>
      <div id="moLines"></div>
      <div class="row c2">
        <label class="f">نام مشتری<input class="in" id="moN" maxlength="100" placeholder="خالی = «سفارش دایرکت»"></label>
        <label class="f">موبایل<input class="in ltr" id="moPh" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx (اختیاری)"></label>
      </div>
      <label class="f">آدرس<textarea class="in" id="moA" maxlength="600" rows="2"></textarea></label>
      <div class="row c3">
        <label class="f">پرداخت<select class="in" id="moPay">${Object.entries(MANUAL).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
        <label class="f">تخفیف (تومان)<input class="in num" id="moD" inputmode="numeric" value="0"></label>
        <label class="f">منبع<input class="in" id="moS" maxlength="40" list="srcs" value="اینستاگرام"><datalist id="srcs"><option>اینستاگرام</option><option>تلفنی</option><option>حضوری</option><option>واتساپ</option><option>تلگرام</option></datalist></label>
      </div>
      <label class="f">یادداشت<input class="in" id="moNote" maxlength="600"></label>
      <label class="chk"><input type="checkbox" id="moSms">پیامک ثبت سفارش برای مشتری و فروشگاه فرستاده بشه</label>
    </div>
    <div class="df"><button class="btn" id="moGo">ثبت سفارش</button><button class="btn ghost" data-x>انصراف</button></div>`, 'wide');
  const fillV = () => {
    const p = prods.find(x => x.id == $('#moP', d).value);
    const vs = parseVariants(p.variants);
    $('#moVW', d).hidden = !vs.length;
    $('#moV', d).innerHTML = vs.map(v => `<option value="${esc(v.name)}">${esc(v.name)}${v.qty != null ? ` (${fa(v.qty)})` : ''}</option>`).join('');
  };
  const draw = () => {
    const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
    const disc = Math.min(intOf($('#moD', d).value) || 0, sub);
    $('#moLines', d).innerHTML = lines.length ? `<div class="box">${lines.map((l, i) => `<div class="line"><span>${esc(l.name)}${l.variant ? ` <span class="muted">(${esc(l.variant)})</span>` : ''}</span><span class="num">× ${fa(l.qty)}</span><span class="num">${toman(l.price * l.qty)}</span><button class="x" data-rm="${i}" aria-label="حذف">×</button></div>`).join('')}
      <div class="sum"><span>جمع${disc ? ' پس از تخفیف' : ''}</span><span class="num">${toman(sub - disc)}</span></div></div>` : '<div class="muted small">هنوز محصولی اضافه نشده</div>';
    $$('[data-rm]', d).forEach(b => b.onclick = () => { lines.splice(+b.dataset.rm, 1); draw(); });

    draw();
  };
  $('#moGo', d).onclick = async e => {
    if (!lines.length) return toast('حداقل یه محصول اضافه کن', true);

    const sms = $('#moSms', d).checked;

    e.target.disabled = true;
    try {
      const r = await q(sb.rpc('admin_place_order', {
        p_items: lines.map(l => ({ id: l.id, qty: l.qty, variant: l.variant, name: l.name })),
        p_name: $('#moN', d).value.trim(), p_phone: ph, p_address: $('#moA', d).value.trim(),
        p_note: $('#moNote', d).value.trim() || null, p_pay: $('#moPay', d).value,
        p_source: $('#moS', d).value.trim() || null, p_discount: intOf($('#moD', d).value) || 0, p_sms: sms,
      }));
      log('order_manual', `${r.tracking_code} · ${r.total}`);
      if (sms) sb.functions.invoke('notify-order', { body: { trackingCode: r.tracking_code } }).then(({ data, error }) => {
        if (error || data?.error) toast('سفارش ثبت شد ولی پیامک نرفت (تنظیمات پیامک رو چک کن)', true);
      });
      d.close(); toast(`سفارش ${fa(r.tracking_code).replace(/٬/g, '')} ثبت شد`); refreshBadges();
      if (location.hash === '#orders') VIEWS.orders();
    } catch (ex) { fail(ex); e.target.disabled = false; }
  };
}

let pSearch = '';
// «S:3:450000, M:ناموجود» ← [{name, qty, price}]
function parseVariants(s) {
  if (!s || !String(s).trim()) return [];
  return String(s).split(/[,،]/).map(x => x.trim()).filter(Boolean).map(x => {
    const [name, qty, price] = x.split(':').map(y => (y || '').trim());
    return { name, qty: qty === 'ناموجود' ? 0 : (/^\d+$/.test(qty || '') ? +qty : null), price: /^\d+(\.\d+)?$/.test(price || '') && +price > 0 ? +price : null };
  });
}
const joinVariants = vs => vs.filter(v => v.name).map(v => [v.name.replace(/[:,،]/g, ' '), v.qty == null ? '' : v.qty, v.price || ''].join(':').replace(/:+$/, '')).join(', ') || null;
const onSale = p => p.sale_price > 0 && p.sale_price < p.price && (!p.sale_starts_at || new Date(p.sale_starts_at) <= Date.now()) && (!p.sale_ends_at || new Date(p.sale_ends_at) > Date.now());

  const STAGE = { download: p => `دانلود مدل هوش مصنوعی… ${fa(Math.round((p || 0) * 100))}٪ (فقط بار اول، حدود ۴۶ مگابایت)`, init: () => 'آماده‌سازی مدل…', run: () => 'در حال حذف پس‌زمینه… (چند ثانیه)', compose: () => 'در حال چیدن روی زمینه‌ی سفید…' };
  async function runBg() {
    if (!origFile || bgBusy || !window.ZLRemoveBg) return;
    bgBusy = true; procBlob = null; useProc = false; showPv();
    pv.classList.add('busy'); st.classList.remove('bad'); st.textContent = 'شروع…';
    $('#pfGo', d).disabled = true;
    const t0 = performance.now();
    try {
      procBlob = await window.ZLRemoveBg(origFile, (stage, p) => { st.textContent = (STAGE[stage] || (() => ''))(p); });
      useProc = true;
      st.textContent = `پس‌زمینه حذف شد (${fa(Math.round((performance.now() - t0) / 1000))} ثانیه). اگه خوب نشده، «عکس اصلی» رو انتخاب کن.`;
    } catch (ex) {
      console.error(ex);

  }

    origFile = f; procBlob = null; useProc = false; st.textContent = ''; showPv();

  };
  bgChk.onchange = () => {
    try { localStorage.setItem('zl-bg', bgChk.checked ? '1' : '0'); } catch (e) { }
    if (bgChk.checked && origFile && !procBlob) runBg();
    else { useProc = bgChk.checked && !!procBlob; showPv(); }
  };
  $('#pfCmp', d).onclick = e => { const b = e.target.closest('button'); if (b) { useProc = b.dataset.c === '1'; showPv(); } };
  if ($('#pfBgCur', d)) $('#pfBgCur', d).onclick = async e => {
    e.target.disabled = true; st.classList.remove('bad'); st.textContent = 'دریافت عکس فعلی…';
    try {
      const r = await fetch(imgUrl); if (!r.ok) throw new Error('http ' + r.status);
      const b = await r.blob();
      origFile = new File([b], 'current.' + ((b.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg')), { type: b.type });
      bgChk.checked = true; await runBg();
    } catch (ex) { st.classList.add('bad'); st.textContent = 'عکس فعلی دریافت نشد.'; }
    e.target.disabled = false;
  };

  $('#pfGo', d).onclick = async e => {
    const f = $('#pf', d);
    if (!f.reportValidity()) return;
    const price = intOf($('#pfP', d).value), sp = intOf($('#pfSP', d).value);
    if (!price) return toast('قیمت رو وارد کن', true);
    if (sp && sp >= price) return toast('قیمت حراج باید کمتر از قیمت اصلی باشه', true);
    if (vars.some(v => !v.name.trim())) return toast('نام همه‌ی مدل‌ها رو پر کن یا ردیف خالی رو حذف کن', true);
    const names = vars.map(v => v.name.trim());

    if (bgBusy) return toast('صبر کن حذف پس‌زمینه تموم بشه', true);
    e.target.disabled = true; e.target.textContent = 'در حال ذخیره…';
    try {
      const imgFile = useProc && procBlob ? new File([procBlob], 'product.jpg', { type: 'image/jpeg' }) : origFile;
      if (imgFile) imgUrl = await uploadImage(imgFile);
      const row = {
        name: $('#pfN', d).value.trim(), category: $('#pfC', d).value.trim(), category_label: $('#pfCL', d).value.trim(),
        price, sale_price: sp || null, stock: intOf($('#pfS', d).value) || 0, is_new: $('#pfNew', d).checked,
        sale_starts_at: sp ? fromLocalInput($('#pfSS', d).value) : null, sale_ends_at: sp ? fromLocalInput($('#pfSE', d).value) : null,
        variants: joinVariants(vars.map(v => ({ ...v, name: v.name.trim() }))), description: $('#pfD', d).value.trim() || null, image_url: imgUrl,
      };
      if (isNew) await q(sb.from('products').insert(row));
      else await q(sb.from('products').update(row).eq('id', p.id));
      log(isNew ? 'product_add' : 'product_edit', row.name);
      toast(isNew ? 'محصول اضافه شد' : 'ذخیره شد'); d.close(); VIEWS.products();
    } catch (ex) { fail(ex); e.target.disabled = false; e.target.textContent = isNew ? 'افزودن محصول' : 'ذخیره'; }
  };
  if (!isNew) $('#pfDel', d).onclick = async () => {
    if (!(await ask(`«${esc(p.name)}» حذف بشه؟ نظرها و علاقه‌مندی‌های این محصول هم پاک می‌شن. سفارش‌های قبلی دست نمی‌خورن.`, 'حذف محصول'))) return;
    try { await q(sb.from('products').delete().eq('id', p.id)); log('product_delete', p.name); toast('حذف شد'); d.close(); VIEWS.products(); } catch (ex) { fail(ex); }
  };
}

// عکس رو حداکثر ۱۴۰۰px و WebP می‌کنه و در باکت image آپلود می‌کنه
async function uploadImage(file) {
  let blob = file, ext = (file.name.split('.').pop() || 'jpg').toLowerCase(), type = file.type || 'image/jpeg';
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, 'image/webp', 0.86));
    if (out && out.type === 'image/webp') { blob = out; ext = 'webp'; type = 'image/webp'; }
  } catch (e) { /* اگه مرورگر نتونست، همون فایل اصلی آپلود می‌شه */ }
  const path = `products/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  await q(sb.storage.from('image').upload(path, blob, { contentType: type, cacheControl: '31536000', upsert: false }));
  return sb.storage.from('image').getPublicUrl(path).data.publicUrl;
}

  $('#view').innerHTML = `<div class="ph"><h2>تنظیمات</h2></div>
    <div class="g2">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card pad"><h3>پرداخت آنلاین (زیبال)</h3>
          <div class="radio-cards" id="pm">
            <label><input type="radio" name="pm" value="off" ${modeNow === 'off' ? 'checked' : ''}><span><b>خاموش — کارت‌به‌کارت</b><small>سفارش بدون درگاه ثبت می‌شه و پرداخت رو خودت پیگیری می‌کنی.</small></span></label>
            <label><input type="radio" name="pm" value="test" ${modeNow === 'test' ? 'checked' : ''}><span><b>آزمایشی</b><small>فقط مدیرها از درگاه تست زیبال رد می‌شن؛ مشتری‌ها مثل حالت خاموش. برای امتحان قبل از روشن کردن.</small></span></label>
            <label><input type="radio" name="pm" value="live" ${modeNow === 'live' ? 'checked' : ''}><span><b>روشن</b><small>همه‌ی مشتری‌ها قبل از ثبت نهایی از درگاه زیبال پرداخت می‌کنن. کد پذیرنده باید در Secrets ثبت شده باشه.</small></span></label>
          </div>
          <div style="margin-top:12px"><button class="btn" id="pmGo">ذخیره</button></div>
        </div>
        <div class="card pad"><h3>مدیرها</h3>
          <table class="tbl"><tbody>${admins.map(a => `<tr><td class="num ltr" style="text-align:right">${esc(showPhone(a.phone))}${a.phone === me.phone ? ' <span class="pill">شما</span>' : ''}</td><td class="small muted">${lastSeen[a.phone] ? 'آخرین حضور: ' + ago(lastSeen[a.phone]) : ''}</td></tr>`).join('')}</tbody></table>
          <p class="small muted" style="margin-top:8px">اضافه یا حذف کردن مدیر به دلایل امنیتی فقط از سمت دیتابیس انجام می‌شه.</p>
        </div>
      </div>
      <div class="card pad"><h3>گزارش کارهای مدیرها</h3>
        ${logs.length ? `<table class="tbl"><tbody>${logs.map(l => `<tr><td><b style="font-weight:500">${esc(ACT[l.action] || l.action)}</b>${l.details ? `<div class="small muted">${esc(l.details)}</div>` : ''}</td><td class="small muted num" style="white-space:nowrap">${esc(showPhone(l.admin_phone))}<br>${ago(l.created_at)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">هنوز کاری ثبت نشده</div>'}
      </div>
    </div>`;
  $('#pmGo').onclick = async e => {
    const v = $('input[name=pm]:checked').value;
    if (v === 'live' && v !== modeNow && !(await ask('پرداخت آنلاین برای همه روشن بشه؟ قبلش با حالت آزمایشی امتحانش کن و مطمئن شو IP دیتابیس در پنل زیبال ثبت شده.', 'روشن کن', false))) return;
    e.target.disabled = true;
    try {
      await q(sb.from('site_settings').upsert({ key: 'payment', value: { mode: v }, updated_at: new Date().toISOString() }));
      log('payment_mode', `${modeNow} → ${v}`); toast('ذخیره شد'); VIEWS.settings();
    } catch (ex) { fail(ex); e.target.disabled = false; }
  };
};
</script>
</body>
</html>
